name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx vsce package --no-dependencies --out cursor-approve.vsix

      - uses: actions/upload-artifact@v6
        with:
          name: cursor-approve-vsix
          path: cursor-approve.vsix
