name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      # Build exactly the source that the GitHub Release's tag identifies.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A tag must identify the same version declared by the extension manifest.
      - name: Verify release version
        id: verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(npm pkg get version | tr -d '"')"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '$package_version'."
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      # --clobber makes a workflow re-run replace the asset instead of failing.
      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "cursor-approve-${{ steps.verify.outputs.version }}.vsix" --clobber

# The CHANGELOG is finalized by `make update-release-docs` before the tag is
# created, not by a job here. A job could not push it: the ruleset on `main`
# requires a pull request, and the GitHub Actions app cannot be given a bypass
# on a user-owned repository. Finalizing beforehand is better regardless, since
# the tag this workflow builds from then carries the released version rather
# than `[Unreleased]`, and so does the changelog bundled in the VSIX.
