name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Build exactly the source that the GitHub Release's tag identifies.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A tag must identify the same version declared by the extension manifest.
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(npm pkg get version | tr -d '"')"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '$package_version'."
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      # --clobber makes a workflow re-run replace the asset instead of failing.
      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "cursor-approve-${PACKAGE_VERSION}.vsix" --clobber
